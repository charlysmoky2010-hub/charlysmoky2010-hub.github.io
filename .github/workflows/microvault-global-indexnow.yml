name: MicroVault global IndexNow
on:
  push:
    branches: [main]
    paths:
      - 'microvault/**'
      - 'sitemap.xml'
      - '.github/workflows/microvault-global-indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microvault-indexnow-main
  cancel-in-progress: true

jobs:
  submit-current-microvault-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read public site sitemap at this commit
        uses: actions/checkout@v4
      - name: Verify owned host and submit MicroVault pages
        shell: bash
        env:
          INDEXNOW_KEY: 'd1d972fbfb20d0bd13106a81777e56acf865b023'
        run: |
          set -euo pipefail
          HOST='charlysmoky2010-hub.github.io'
          KEY_URL="https://${HOST}/${INDEXNOW_KEY}.txt"
          echo 'Verifying existing published IndexNow ownership key'
          verified=0
          for attempt in 1 2 3 4 5 6; do
            actual="$(curl --fail --silent --show-error --location --max-time 15 "${KEY_URL}" || true)"
            if [ "${actual}" = "${INDEXNOW_KEY}" ]; then verified=1; break; fi
            sleep 12
          done
          if [ "${verified}" != 1 ]; then
            echo "::error::Existing IndexNow ownership proof unavailable; refusing notification"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit
          host = 'charlysmoky2010-hub.github.io'
          root = ET.parse('sitemap.xml').getroot()
          namespace = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = []
          for node in root.findall('.//sm:url/sm:loc', namespace):
              raw = (node.text or '').strip()
              target = urlsplit(raw)
              if (target.scheme == 'https' and target.netloc == host
                      and target.path.startswith('/microvault/')
                      and not target.query and not target.fragment):
                  urls.append(raw)
          urls = list(dict.fromkeys(urls))
          if not (10 <= len(urls) <= 60):
              raise SystemExit('Refusing unexpected number of owned MicroVault URLs: ' + str(len(urls)))
          payload = {'host': host, 'key': os.environ['INDEXNOW_KEY'],
                     'keyLocation': f'https://{host}/{os.environ["INDEXNOW_KEY"]}.txt',
                     'urlList': urls}
          Path('/tmp/microvault-indexnow.json').write_text(json.dumps(payload))
          print('Qualified owner-controlled MicroVault URL count:',len(urls))
          PY
          echo 'Verifying every declared URL is already live'
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          data = json.load(open('/tmp/microvault-indexnow.json', encoding='utf-8'))
          for url in data['urlList']:
              for attempt in range(4):
                  try:
                      req = Request(url, headers={'User-Agent':'MicroVault-IndexNow-Verify/1.0'})
                      with urlopen(req, timeout=15) as r:
                          if r.status == 200: break
                  except Exception:
                      pass
                  if attempt == 3: raise SystemExit('Site not published (no IndexNow claim): '+url)
                  time.sleep(10)
              print('Verified live:',url)
          PY
          http_code="$(curl --silent --show-error --max-time 25 -o /tmp/microvault-indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -X POST --data-binary @/tmp/microvault-indexnow.json \
            https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: ${http_code}"
          if [ "${http_code}" != 200 ] && [ "${http_code}" != 202 ]; then
            cat /tmp/microvault-indexnow-response.txt
            exit 1
          fi
          echo 'IndexNow accepted owned URL notification. Indexing, leads or purchases are not promised.'
