name: Deploy PHI Nexus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront source
        uses: actions/checkout@v4

      - name: Prepare and validate static artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          find . -maxdepth 1 -type f \
            \( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' -o -name '.nojekyll' \) \
            -exec cp '{}' _site/ \;

          test -s _site/index.html
          test -s _site/offers.html
          test -s _site/ai-systems-audit.html
          test -s _site/ai-systems-audit-sample.html

          grep -Fq 'https://book.stripe.com/fZu7sLgEAdC65WPbjb6Na0Y' _site/ai-systems-audit.html
          grep -Fq 'Fictional demonstration' _site/ai-systems-audit-sample.html

          printf 'Published files:\n'
          find _site -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
